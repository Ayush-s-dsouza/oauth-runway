# Render Blueprint: New -> Blueprint -> pick this repo. Free plan: no card needed,
# sleeps after 15 min idle (~1 min to wake), disk is wiped on sleep/restart.
services:
  - type: web
    name: oauth-runway
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/status
    envVars:
      - key: ANTHROPIC_API_KEY     # set in the dashboard; never committed
        sync: false
      - key: COMPOSIO_API_KEY      # optional: enables the Composio catalog lookup
        sync: false
      - key: GENERATION_DAILY_CAP  # ~$0.40 per live guide -> at most ~$6/day
        value: "15"
      - key: RATE_LIMIT_PER_MIN
        value: "2"
      - key: REPO_URL
        value: https://github.com/Ayush-s-dsouza/oauth-runway
