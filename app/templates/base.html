<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}OAuth Runway{% endblock %}</title>
<meta name="description" content="{% block description %}How long until your OAuth app is approved? Guides for registering provider OAuth apps, from first connection to public launch.{% endblock %}">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232563eb'/><path d='M7 22h18M10 17l6-8 6 8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/></svg>">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/"><span class="logo" aria-hidden="true"></span>OAuth Runway</a>
    <nav>
      <a href="/#library">Library</a>
      {% if REPO_URL %}<a href="{{ REPO_URL }}">Source</a>{% endif %}
    </nav>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="wrap foot">
  Guides are researched by an agent and, where marked, checked by hand. Provider policies change. Check the linked sources before you rely on a date.
</footer>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
