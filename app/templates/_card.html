<a class="card" href="/g/{{ g.slug }}">
  <div class="card-top">
    <b>{{ g.app.name }}</b>
    <span class="badge d-{{ g.verdict.difficulty }}">{{ DIFFICULTY_LABEL[g.verdict.difficulty] }}</span>
  </div>
  <dl class="mini">
    <div><dt>First connection</dt><dd>{{ g.verdict.time_to_first_connection }}</dd></div>
    <div><dt>Public approval</dt><dd>{{ g.verdict.approval_wait }}</dd></div>
  </dl>
  <p class="card-sum">{{ g.verdict.summary | truncate(150) }}</p>
</a>
